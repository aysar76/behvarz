name: Deploy

# قالب استقرار برای فاز ۱۳. این Workflow فقط پس از تعیین زیرساخت هدف (رجیستری،
# محیط Production) و افزودن Secretهای لازم فعال می‌شود؛ بدون آن به‌صورت خودکار اجرا نمی‌شود.
#
# پیش‌نیازها:
#   - تصویر Docker روی رجیستری (این Workflow تصویر را ساخته و push می‌کند)
#   - Secret های: REGISTRY, REGISTRY_USERNAME, REGISTRY_PASSWORD
#   - محیط استقرار (SSH/نام‌هنگام) به‌صورت دستی/قابل تطبیق
#
# جریان پیشنهادی (Rollback-ready):
#   1. build & push تصویر با برچسب commit-sha
#   2. اجرای Migration (migrate deploy) — کنترل‌شده
#   3. استقرار تصویر (rollout) روی تک‌نمونه
#   4. Health Check پس از استقرار (/api/health)
#   5. در صورت شکست Health Check → Rollback به تصویر قبلی

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "محیط استقرار"
        required: true
        default: "production"

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: false # تا تعیین زیرساخت هدف، غیرفعال است
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/behvarz:${{ github.sha }}
            ${{ secrets.REGISTRY }}/behvarz:latest

  deploy:
    name: Deploy (migration + rollout + health check)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: false # تا تعیین زیرساخت هدف، غیرفعال است
    steps:
      - name: Run controlled migration
        run: |
          # روی نمونه Production با DATABASE_URL واقعی:
          # npx prisma migrate deploy --config prisma7.config.ts
          echo "Migration deploy (به‌صورت دستی/Orchestrator اجرا شود)"

      - name: Rollout
        run: |
          # بسته به زیرساخت هدف (docker-compose up / kubectl rollout / ...):
          echo "Rollout image ${{ secrets.REGISTRY }}/behvarz:${{ github.sha }}"

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.APP_URL }}/api/health" >/dev/null 2>&1; then
              echo "Health OK"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          # Rollback به تصویر/دیتابیس قبلی (راهنمای docs/deployment-guide.md)
          echo "Rollback به تصویر قبلی"
