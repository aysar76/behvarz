name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint / Type / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test:run

      - name: Migration check (deployable on a clean database)
        run: |
          mkdir -p /tmp/behvarz-migrate
          DATABASE_URL="file:/tmp/behvarz-migrate/check.db" npx prisma migrate deploy --config prisma7.config.ts
        env:
          DATABASE_URL: "file:/tmp/behvarz-migrate/check.db"

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "file:./dev.db"
